services:
  aum:
    build: .
    image: aum:local
    restart: unless-stopped
    working_dir: /data
    environment:
      AUM_DATA__DIR: /data
      AUM_OPENSEARCH__URL: http://opensearch:9200
      AUM_TIKA__SERVER_URL: http://tika:9998
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - aum-data:/data
      - ${AUM_DOCUMENTS_DIR:-./documents}:/documents:ro
    depends_on:
      opensearch:
        condition: service_healthy
      tika:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Alternative: Meilisearch backend (set AUM_SEARCH_BACKEND=meilisearch)
  # meilisearch:
  #   restart: "always"
  #   image: docker.io/getmeili/meilisearch:v1.40.0
  #   environment:
  #     - MEILI_NO_ANALYTICS=true
  #   ports:
  #     - "7700:7700"
  #   volumes:
  #     - meili-data:/meili_data

  tika:
    restart: "always"
    image: docker.io/apache/tika:4.0.0-1-full
    command: -c /tika-config.json
    ports:
      - "127.0.0.1:9998:9998"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:9998/tika"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - ./tika-config.json:/tika-config.json:ro

  opensearch:
    restart: "always"
    image: docker.io/opensearchproject/opensearch:3.6.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Tr0ub4dor&3xKq9fLp
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - search.insights.top_queries.exporter.type=none
      - search.insights.top_queries.latency.enabled=false
      - search.insights.top_queries.cpu.enabled=false
      - search.insights.top_queries.memory.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' | grep -q '\"timed_out\":false'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  # Run Ollama on the host for GPU acceleration (`ollama serve`).
  # ollama:
  #   image: docker.io/ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   environment:
  #     - OLLAMA_NUM_PARALLEL=8

volumes:
  aum-data:
  opensearch-data:
  # meili-data:
